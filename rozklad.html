<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>⚡ Щоденник тренувань</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg0:#0c0c0e;--bg1:#141416;--bg2:#1c1c1f;--bg3:#242428;--bg4:#2e2e33;
    --b1:#333338;--b2:#3e3e44;--b3:#4a4a52;
    --t1:#e8e8ea;--t2:#b0b0b6;--t3:#6a6a72;--t4:#3e3e45;
    --acc:#f0f0f2;--acc2:#c0c0c8;
  }
  body{font-family:'Barlow Condensed',Arial,sans-serif;background:var(--bg0);color:var(--t1);min-height:100vh}
  input,textarea,button{font-family:inherit}
  input[type=number]{-moz-appearance:textfield}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
  ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--b3)}

  .app{max-width:480px;margin:0 auto;padding-bottom:40px}
  .topnav{background:var(--bg1);border-bottom:1px solid #1e1e2e;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
  .topnav-title{font-weight:800;font-size:18px;letter-spacing:1px}
  .topnav-btns{display:flex;gap:5px}
  .nav-btn{background:var(--bg3);border:1px solid var(--b2);color:var(--t3);border-radius:6px;padding:5px 9px;font-size:11px;letter-spacing:1px;cursor:pointer;transition:all .15s}
  .nav-btn:hover{filter:brightness(1.2)}
  .back-btn{background:var(--bg3);border:1px solid var(--b2);color:var(--t3);border-radius:6px;padding:4px 10px;font-size:18px;cursor:pointer;transition:all .15s;display:none}
  .page{padding:16px;display:none;animation:fadeIn .2s ease}
  .page.active{display:block}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* STAT CARDS */
  .stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:20px}
  .stat-card{background:var(--bg2);border-radius:10px;padding:12px 8px;text-align:center;border-top:2px solid var(--b3)}
  .stat-label{font-size:10px;color:var(--t3);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
  .stat-val{font-size:20px;font-weight:800;color:var(--t1)}
  .stat-unit{font-size:11px;color:var(--t3);margin-left:2px}

  /* DAY CARDS */
  .section-label{font-size:11px;letter-spacing:3px;color:var(--t4);text-transform:uppercase;margin-bottom:10px}
  .day-card{background:var(--bg1);border:1px solid var(--c,#333);border-left:4px solid var(--c,#333);border-radius:10px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:all .2s}
  .day-card:hover{transform:translateY(-2px);filter:brightness(1.1)}
  .day-badge{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;margin-right:12px}
  .day-info{flex:1}
  .day-name{font-weight:700;font-size:15px}
  .day-last{font-size:11px;color:var(--t4);margin-top:2px}
  .day-arrow{font-size:20px}

  /* WEIGHT TRACKER */
  .weight-box{background:var(--bg1);border:1px solid var(--b1);border-radius:10px;padding:14px;margin-top:20px}
  .weight-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .weight-input{background:var(--bg3);border:1px solid var(--b2);color:#fff;border-radius:6px;padding:8px 0;font-size:22px;font-weight:800;width:90px;text-align:center}
  .weight-unit{color:var(--t3);font-size:14px}
  .weight-status{flex:1;text-align:right;font-size:12px;font-weight:700}
  .progress-bar-bg{background:var(--bg3);border-radius:4px;height:6px;overflow:hidden}
  .progress-bar-fill{height:100%;border-radius:4px;transition:width .4s ease}
  .progress-labels{display:flex;justify-content:space-between;margin-top:4px;font-size:10px;color:var(--t4)}

  /* LOG PAGE */
  .ex-block{background:var(--bg1);border:1px solid var(--b1);border-radius:10px;margin-bottom:10px;overflow:hidden}
  .ex-header{padding:8px 14px;border-bottom:1px solid #1e1e2e;display:flex;align-items:center;gap:8px}
  .ex-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
  .ex-title{font-weight:700;font-size:14px;flex:1}
  .info-btn{width:22px;height:22px;border-radius:50%;border:1px solid var(--b3);background:var(--bg3);color:var(--t3);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800;transition:all .15s}
  .info-btn:hover{border-color:var(--b3);color:var(--t2);background:var(--bg4)}
  .sets-area{padding:8px 14px}
  .sets-head{display:grid;grid-template-columns:40px 1fr 1fr 44px;gap:6px;margin-bottom:6px;font-size:10px;color:var(--t4);letter-spacing:1px;text-transform:uppercase}
  .set-row{display:grid;grid-template-columns:40px 1fr 1fr 44px;gap:6px;margin-bottom:6px;align-items:center}
  .set-num{width:28px;height:28px;border-radius:6px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--t3);font-weight:700}
  .set-input{background:var(--bg3);border:1px solid var(--b2);color:#fff;border-radius:6px;padding:6px 0;font-size:16px;font-weight:700;width:100%;text-align:center}
  .set-input.done{border-color:var(--dc,#555)}
  .set-done-btn{width:36px;height:36px;border-radius:8px;background:var(--bg3);border:2px solid #2e2e3e;color:var(--t4);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
  .set-done-btn.active{color:#0c0c0e;background:var(--acc);border-color:var(--acc)}
  .set-row.completed{opacity:.5}

  .extra-box{background:var(--bg1);border:1px solid var(--b1);border-radius:10px;padding:14px;margin-bottom:10px}
  .extra-label{font-size:11px;color:var(--t3);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
  .cardio-input{background:var(--bg3);border:1px solid var(--b2);color:#fff;border-radius:6px;padding:8px 12px;font-size:22px;font-weight:800;width:100px;text-align:center}
  .notes-input{background:var(--bg3);border:1px solid var(--b2);color:#fff;border-radius:6px;padding:8px 12px;font-size:13px;width:100%;min-height:70px;resize:vertical;font-family:'Barlow',sans-serif;line-height:1.5}
  .save-btn{width:100%;color:#fff;border:none;border-radius:10px;padding:14px;font-size:16px;font-weight:800;letter-spacing:2px;cursor:pointer;transition:all .15s;margin-top:4px}
  .save-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
  .save-btn:active{transform:none}

  /* SAVED SCREEN */
  .saved-screen{text-align:center;padding:60px 0}
  .saved-icon{font-size:64px}
  .saved-title{font-size:24px;font-weight:800;margin-top:12px}
  .saved-sub{color:var(--t3);margin-top:6px;font-family:'Barlow',sans-serif}

  /* HISTORY */
  .hist-card{background:var(--bg1);border-radius:10px;margin-bottom:8px;overflow:hidden;border:1px solid var(--b1);border-left:4px solid var(--hc,#555)}
  .hist-head{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
  .hist-name{font-weight:700;font-size:14px}
  .hist-meta{font-size:11px;color:var(--t4);margin-top:2px}
  .hist-vol{font-size:13px;font-weight:700;text-align:right}
  .hist-arrow{color:var(--t4);font-size:14px;margin-top:2px}
  .hist-body{padding:0 14px 12px;border-top:1px solid var(--b1);display:none}
  .hist-body.open{display:block}
  .hist-ex-name{font-size:12px;color:var(--t3);font-weight:700;margin:10px 0 4px}
  .hist-sets{display:flex;flex-wrap:wrap;gap:4px}
  .hist-set-badge{border-radius:4px;padding:3px 8px;font-size:12px;border:1px solid}
  .hist-notes{margin-top:10px;color:var(--t3);font-size:12px;font-style:italic;border-top:1px solid var(--b1);padding-top:8px;font-family:'Barlow',sans-serif}
  .del-btn{margin-top:10px;background:transparent;border:1px solid var(--b3);color:var(--t4);border-radius:6px;padding:4px 12px;font-size:11px;cursor:pointer}
  .empty-state{text-align:center;padding:60px 0;color:var(--t4)}
  .empty-icon{font-size:48px}
  .empty-text{margin-top:12px;font-family:'Barlow',sans-serif;font-size:14px;line-height:1.6}

  /* STATS PAGE */
  .stats2-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
  .pr-row{display:flex;justify-content:space-between;border-bottom:1px solid #1e1e2e;padding:7px 0;align-items:center}
  .pr-name{font-size:12px;color:var(--t2)}
  .pr-badge{background:var(--bg3);border:1px solid var(--b3);color:var(--t2);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:700;letter-spacing:1px}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;align-items:flex-end;justify-content:center}
  .modal-overlay.open{display:flex}
  .modal-box{background:var(--bg1);border:1px solid #2e2e4e;border-radius:16px 16px 0 0;width:100%;max-width:480px;padding:20px 20px 32px;animation:slideUp .25s ease}
  @keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .modal-title{font-size:16px;font-weight:800;color:var(--t1);margin-bottom:8px}
  .modal-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:2px;background:var(--bg4);border-radius:4px;padding:2px 8px;color:var(--t3)8cc;margin-bottom:12px}
  .modal-desc{font-family:'Barlow',sans-serif;font-size:14px;color:var(--t2);line-height:1.7}
  .modal-close{width:100%;margin-top:16px;background:var(--bg3);border:1px solid var(--b2);color:var(--t3);border-radius:8px;padding:12px;font-size:14px;cursor:pointer;font-weight:700}

  /* CALENDAR */
  .cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .cal-nav-btn{background:var(--bg3);border:1px solid var(--b2);color:var(--t3);border-radius:6px;padding:6px 14px;font-size:16px;cursor:pointer}
  .cal-month{font-size:16px;font-weight:800;letter-spacing:1px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
  .cal-dow{text-align:center;font-size:10px;color:var(--t4);letter-spacing:1px;padding:4px 0}
  .cal-day{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;background:var(--bg2);border:1px solid var(--b1);position:relative}
  .cal-day.empty{background:transparent;border-color:transparent;cursor:default}
  .cal-day.today{border-color:var(--b3)}
  .cal-day.has-workout{color:#fff}
  .cal-day.other-month{opacity:.3}
  .cal-dot{width:5px;height:5px;border-radius:50%;margin-top:2px}
  .cal-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .cal-leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t3)}
  .cal-leg-dot{width:8px;height:8px;border-radius:50%}
  .cal-detail{background:var(--bg1);border:1px solid var(--b1);border-radius:10px;padding:14px;margin-top:12px}
  .cal-detail-title{font-size:14px;font-weight:700;margin-bottom:6px}
  .cal-detail-meta{font-size:11px;color:var(--t3)}

  /* HEALTH */
  .health-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .health-field{background:var(--bg1);border:1px solid var(--b1);border-radius:10px;padding:12px}
  .health-field.full{grid-column:1/-1}
  .health-label{font-size:10px;color:var(--t3);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
  .health-input{background:var(--bg3);border:1px solid var(--b2);color:#fff;border-radius:6px;padding:8px;font-size:20px;font-weight:800;width:100%;text-align:center}
  .health-unit{font-size:11px;color:var(--t4);text-align:center;margin-top:3px}
  .kcal-balance{background:var(--bg1);border:1px solid var(--b1);border-radius:10px;padding:16px;margin-bottom:12px;text-align:center}
  .kcal-balance-label{font-size:10px;color:var(--t4);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
  .kcal-balance-val{font-size:32px;font-weight:800}
  .kcal-balance-sub{font-size:12px;color:var(--t3);margin-top:4px;font-family:'Barlow',sans-serif}
  .samsung-note{background:var(--bg2);border:1px solid var(--b2);border-radius:10px;padding:12px;margin-bottom:12px}
  .samsung-note-title{font-size:11px;font-weight:800;color:var(--t2);letter-spacing:1px;margin-bottom:5px}
  .samsung-note-text{font-size:12px;color:var(--t3);font-family:'Barlow',sans-serif;line-height:1.6}
  .meal-add-row{display:flex;gap:8px;margin-bottom:10px}
  .meal-add-input{flex:1;background:var(--bg3);border:1px solid var(--b2);color:var(--t1);border-radius:8px;padding:10px 14px;font-size:18px;font-weight:700;font-family:'Barlow Condensed',sans-serif;text-align:center}
  .meal-add-btn{background:var(--acc);color:#0c0c0e;border:none;border-radius:8px;padding:10px 18px;font-size:16px;font-weight:800;cursor:pointer;white-space:nowrap;font-family:inherit}
  .meal-list{margin-bottom:10px}
  .meal-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--bg2);border:1px solid var(--b1);border-radius:8px;margin-bottom:5px}
  .meal-kcal{font-size:15px;font-weight:700;color:var(--t1)}
  .meal-time{font-size:11px;color:var(--t3)}
  .meal-del{background:none;border:none;color:var(--t4);font-size:16px;cursor:pointer;padding:0 4px}
  .meal-total{text-align:center;padding:10px;background:var(--bg2);border-radius:8px;margin-bottom:10px;border:1px solid var(--b1)}
  .meal-total-val{font-size:26px;font-weight:800;color:var(--t1)}
  .meal-total-label{font-size:11px;color:var(--t3);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
  .health-hist-card{background:var(--bg1);border:1px solid var(--b1);border-radius:10px;padding:12px;margin-bottom:8px}
  .health-hist-date{font-size:11px;color:var(--t4);margin-bottom:8px}
  .health-hist-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0}
  .health-hist-key{font-size:12px;color:var(--t3)}
  .health-hist-val{font-size:13px;font-weight:700}
  .health-tabs{display:flex;gap:6px;margin-bottom:14px}
  .htab{flex:1;background:var(--bg3);border:1px solid var(--b2);color:var(--t3);border-radius:6px;padding:8px;font-size:12px;cursor:pointer;text-align:center;font-weight:700;letter-spacing:1px}
  .htab.active{background:var(--bg3);border-color:var(--b3);color:var(--t1)}
</style>
</head>
<body>
<div class="app">
  <!-- TOP NAV -->
  <div class="topnav">
    <div style="display:flex;align-items:center;gap:8px">
      <button class="back-btn" id="backBtn" onclick="goHome()">←</button>
      <span class="topnav-title" id="navTitle">⚡ ЩОДЕННИК</span>
    </div>
    <div class="topnav-btns" id="navBtns">
      <button class="nav-btn" onclick="showPage('calendar')">📅</button>
      <button class="nav-btn" onclick="showPage('health')">🍽</button>
      <button class="nav-btn" onclick="showPage('history')">ЖУРНАЛ</button>
      <button class="nav-btn" onclick="showPage('stats')">ПРОГРЕС</button>
    </div>
  </div>

  <!-- HOME PAGE -->
  <div class="page active" id="page-home">
    <div class="stats-row" id="homeStats"></div>
    <div class="section-label">Вибери день тренування</div>
    <div id="dayList"></div>
    <div class="weight-box">
      <div class="section-label">Моя вага сьогодні</div>
      <div class="weight-row">
        <input type="number" class="weight-input" id="weightInput" step="0.1" oninput="updateWeight(this.value)">
        <span class="weight-unit">кг</span>
        <div class="weight-status" id="weightStatus"></div>
      </div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="weightBar"></div></div>
      <div class="progress-labels"><span>Старт: 85 кг</span><span>Мета: 80 кг</span></div>
    </div>
  </div>

  <!-- LOG PAGE -->
  <div class="page" id="page-log">
    <div id="logContent"></div>
  </div>

  <!-- HISTORY PAGE -->
  <div class="page" id="page-history">
    <div id="histContent"></div>
  </div>

  <!-- STATS PAGE -->
  <div class="page" id="page-stats">
    <div id="statsContent"></div>
  </div>

  <!-- CALENDAR PAGE -->
  <div class="page" id="page-calendar">
    <div id="calContent"></div>
  </div>

  <!-- HEALTH PAGE -->
  <div class="page" id="page-health">
    <div id="healthContent"></div>
  </div>
</div>

<!-- INFO MODAL -->
<div class="modal-overlay" id="infoModal" onclick="closeModal(event)">
  <div class="modal-box">
    <div class="modal-tag" id="modalTag">ТЕХНІКА</div>
    <div class="modal-title" id="modalTitle">Назва вправи</div>
    <div class="modal-desc" id="modalDesc">Опис</div>
    <button class="modal-close" onclick="closeInfoModal()">Зрозуміло ✓</button>
  </div>
</div>

<script>
// ── PLAN ── PPL×2 | Рельєф | 85→80 кг | 47 р.
const PLAN = [
  {id:1,label:"Пн",focus:"Push A — Груди · Плечі · Трицепс",color:"#4a4a52",sc:4,
   exercises:[
    {name:"Тренажер жим груді",dw:0,
     desc:"Сідь рівно, лопатки зведені разом і притиснуті до спинки. Повільно опускай рукоятку (2 сек), вибухово жми вперед. Не розгинай руки до кінця — тримай напруження в грудях."},
    {name:"Жим гантелей 30° (похила лава)",dw:12.5,
     desc:"Лава під кутом 30°. Лікті під кутом 45° від корпусу — не розводь широко. Опускай гантелі до рівня верху грудей, жми вгору і трохи всередину в кінці. Акцент на верхній частині грудей."},
    {name:"Жим гантелей горизонтально",dw:15,
     desc:"Лежачи горизонтально. Гантелі на рівні грудей, лікті 45° від тулуба. Повна амплітуда — від розтяжки внизу до майже торкання гантелей вгорі. Відчуй роботу грудей, не рук."},
    {name:"Жим гантелей над головою (сидячи)",dw:10,
     desc:"Сидячи з прямою спиною. Гантелі на рівні вух, ліктями трохи вперед. Жми вгору без повного розгинання — залишай легкий згин у ліктях. Не прогинай поперек."},
    {name:"Підйом у сторони (★ суперсет)",dw:8,
     desc:"Суперсет — виконуй одразу після підйому вперед без паузи. Стоячи, гантелі по боках. Підіймай руки через сторони до паралелі підлозі. Повільно опускай 3 секунди. Без гойдання корпусом — не допомагай тілом."},
    {name:"Підйом вперед (★ суперсет)",dw:8,
     desc:"Суперсет — виконуй одразу після підйому в сторони без паузи. Гантелі перед стегнами, долоні вниз або нейтрально. Підіймай руки вперед до рівня плеча. Можна по черзі або обидві разом."},
    {name:"Тренажер трицепс (push-down)",dw:0,
     desc:"Стій прямо, лікті притиснуті до корпусу — вони нерухомі весь час! Тисни рукоятку вниз до повного розгинання рук, потім повільно повертай вгору. Тільки передпліччя рухаються."},

// ── DATA ──
function load(){
  try{ return JSON.parse(localStorage.getItem('wj3') || '{"logs":[],"bw":85,"health":[]}'); }
  catch{ return {logs:[],bw:85,health:[]}; }
}
function save(d){ localStorage.setItem('wj3', JSON.stringify(d)); }
let DB = load();
if(!DB.health) DB.health = [];

// ── HELPERS ──
const fmt = d => new Date(d).toLocaleDateString('uk-UA',{day:'2-digit',month:'2-digit',year:'2-digit'});
const fmtDate = d => new Date(d).toLocaleDateString('uk-UA',{day:'2-digit',month:'long'});
const hex2rgba = (hex,a) => `rgba(${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)},${a})`;
const todayKey = () => new Date().toISOString().slice(0,10);

// ── NAVIGATION ──
let currentPage = 'home';
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.getElementById('backBtn').style.display = name==='home'?'none':'block';
  document.getElementById('navBtns').style.display = name==='home'?'flex':'none';
  currentPage = name;
  const titles = {home:'⚡ ЩОДЕННИК',log:'💪 ТРЕНУВАННЯ',history:'📋 ЖУРНАЛ',stats:'📊 ПРОГРЕС',calendar:'📅 КАЛЕНДАР',health:'🍽 БАЛАНС КАЛОРІЙ'};
  document.getElementById('navTitle').textContent = titles[name]||''
  if(name==='home') renderHome();
  if(name==='history') renderHistory();
  if(name==='stats') renderStats();
  if(name==='calendar') renderCalendar();
  if(name==='health') renderHealth();
}
function goHome(){ showPage('home'); }

// ── HOME ──
function renderHome(){
  const logs = DB.logs;
  const week = logs.filter(l=>Date.now()-new Date(l.date)<7*86400000).length;
  const cardio = logs.reduce((a,l)=>a+(+l.cardioMin||0),0);
  document.getElementById('homeStats').innerHTML = `
    <div class="stat-card" style="--c:var(--b3)">
      <div class="stat-label">Тренувань</div>
      <div class="stat-val">${logs.length}<span class="stat-unit">раз</span></div>
    </div>
    <div class="stat-card" style="--c:var(--b3)">
      <div class="stat-label">Тижень</div>
      <div class="stat-val">${week}<span class="stat-unit">раз</span></div>
    </div>
    <div class="stat-card" style="--c:var(--b3)">
      <div class="stat-label">Кардіо</div>
      <div class="stat-val">${cardio}<span class="stat-unit">хв</span></div>
    </div>`;
  let html = '';
  PLAN.forEach(d=>{
    const last = [...logs].reverse().find(l=>l.dayId===d.id);
    const lastTxt = last ? `Останнє: ${fmt(last.date)}` : 'Ще не тренувався';
    html += `<div class="day-card" style="--c:#3a3a42;border-left-color:#3a3a42;border-color:#2a2a2f;background:var(--bg1)" onclick="startLog(${d.id})">
      <div class="day-badge" style="background:var(--bg3);border:1px solid var(--b2);color:var(--t2)">${d.label}</div>
      <div class="day-info"><div class="day-name">${d.focus}</div><div class="day-last" style="color:var(--t4)">${lastTxt}</div></div>
      <div class="day-arrow" style="color:var(--t4)">›</div>
    </div>`;
  });
  document.getElementById('dayList').innerHTML = html;
  const w = DB.bw||85;
  document.getElementById('weightInput').value = w;
  const pct = Math.min(100,Math.max(0,((85-w)/5)*100));
  const color = w<=80?'var(--acc)':'var(--b3)';
  document.getElementById('weightBar').style.width = pct+'%';
  document.getElementById('weightBar').style.background = color;
  document.getElementById('weightStatus').innerHTML = `<span style="color:${color};font-weight:700">${w<=80?'✅ ЦІЛЬ!':'ще '+(w-80).toFixed(1)+' кг до мети'}</span>`;
}
function updateWeight(v){
  DB.bw = +v||85; save(DB);
  const pct = Math.min(100,Math.max(0,((85-DB.bw)/5)*100));
  const color = DB.bw<=80?'var(--acc)':'var(--b3)';
  document.getElementById('weightBar').style.width=pct+'%';
  document.getElementById('weightBar').style.background=color;
  document.getElementById('weightStatus').innerHTML=`<span style="color:${color};font-weight:700">${DB.bw<=80?'✅ ЦІЛЬ!':'ще '+(DB.bw-80).toFixed(1)+' кг до мети'}</span>`;
}

// ── LOG ──
let currentForm = null;
function startLog(dayId){
  const day = PLAN.find(d=>d.id===dayId);
  const last = [...DB.logs].reverse().find(l=>l.dayId===dayId);
  currentForm = {
    dayId, dayLabel:day.focus, color:day.color,
    cardioMin:0, notes:'',
    exercises: day.exercises.map((ex,ei)=>({
      name:ex.name,
      sets:Array.from({length:day.sc||4},(_,si)=>{
        const p = last?.exercises?.[ei]?.sets?.[si];
        return {weight:p?.weight??ex.dw, reps:p?.reps??12, done:false};
      })
    }))
  };
  document.getElementById('navTitle').textContent = '💪 '+day.label;
  renderLog();
  showPage('log');
}

function showInfo(dayId, exIdx){
  const day = PLAN.find(d=>d.id===dayId);
  const ex = day.exercises[exIdx];
  const typeMap={1:'PUSH A',2:'PULL A',3:'LEGS A',4:'PUSH B',5:'PULL B',6:'LEGS B',7:'ВІДНОВЛЕННЯ'};
  document.getElementById('modalTag').textContent = typeMap[dayId]||'ТЕХНІКА';
  document.getElementById('modalTitle').textContent = ex.name;
  document.getElementById('modalDesc').textContent = ex.desc || 'Опис техніки відсутній.';
  document.getElementById('infoModal').classList.add('open');
}
function closeInfoModal(){
  document.getElementById('infoModal').classList.remove('open');
}
function closeModal(e){
  if(e.target===document.getElementById('infoModal')) closeInfoModal();
}

function renderLog(){
  if(!currentForm){return;}
  const f = currentForm;
  const day = PLAN.find(d=>d.id===f.dayId);
  let html = '';
  f.exercises.forEach((ex,ei)=>{
    html += `<div class="ex-block">
      <div class="ex-header" style="background:var(--bg2);border-bottom-color:var(--b1)">
        <div class="ex-num" style="background:var(--bg4);border:1px solid var(--b3);color:var(--t2)">${ei+1}</div>
        <div class="ex-title">${ex.name}</div>
        <button class="info-btn" onclick="showInfo(${f.dayId},${ei})">i</button>
      </div>
      <div class="sets-area">
        <div class="sets-head"><div>Підх.</div><div style="text-align:center">Вага (кг)</div><div style="text-align:center">Повт.</div><div style="text-align:center">✓</div></div>`;
    ex.sets.forEach((s,si)=>{
      const doneClass = s.done?'completed':'';
      const btnClass = s.done?'active':'';
      const inputBorder = s.done?`border-color:${f.color}66`:'';
      html += `<div class="set-row ${doneClass}" id="sr-${ei}-${si}">
        <div class="set-num">${si+1}</div>
        <input type="number" class="set-input" style="${inputBorder}" value="${s.weight}" oninput="updateSet(${ei},${si},'weight',this.value)">
        <input type="number" class="set-input" style="${inputBorder}" value="${s.reps}" oninput="updateSet(${ei},${si},'reps',this.value)">
        <button class="set-done-btn ${btnClass}" id="db-${ei}-${si}" onclick="toggleDone(${ei},${si})">✓</button>
      </div>`;
    });
    html += '</div></div>';
  });
  html += `<div class="extra-box">
    <div class="extra-label">🏃 Кардіо (хвилин)</div>
    <input type="number" class="cardio-input" value="${f.cardioMin}" oninput="currentForm.cardioMin=this.value">
  </div>
  <div class="extra-box">
    <div class="extra-label">🔥 Витрачено ккал (з годинника)</div>
    <input type="number" class="cardio-input" id="burnedInput" value="${f.burned||''}" placeholder="0" oninput="currentForm.burned=+this.value">
  </div>
  <div class="extra-box">
    <div class="extra-label">📝 Нотатки</div>
    <textarea class="notes-input" placeholder="Як відчував себе? Що болить? Що покращити..." oninput="currentForm.notes=this.value">${f.notes}</textarea>
  </div>
  <button class="save-btn" style="background:var(--acc);color:#0c0c0e;box-shadow:none" onclick="saveLog()">✅ ЗБЕРЕГТИ ТРЕНУВАННЯ</button>`;
  document.getElementById('logContent').innerHTML = html;
}
function updateSet(ei,si,field,val){
  currentForm.exercises[ei].sets[si][field] = +val||0;
}
function toggleDone(ei,si){
  const s = currentForm.exercises[ei].sets[si];
  s.done = !s.done;
  const row = document.getElementById(`sr-${ei}-${si}`);
  const btn = document.getElementById(`db-${ei}-${si}`);
  row.classList.toggle('completed',s.done);
  btn.classList.toggle('active',s.done);
  const c = currentForm.color;
  row.querySelectorAll('.set-input').forEach(inp=>inp.style.borderColor=s.done?'var(--b3)':'');
}
function saveLog(){
  const log = {...currentForm, date:new Date().toISOString(), id:Date.now()};
  DB.logs.push(log); save(DB);
  document.getElementById('logContent').innerHTML = `
    <div class="saved-screen">
      <div class="saved-icon">✅</div>
      <div class="saved-title">ЗБЕРЕЖЕНО!</div>
      <div class="saved-sub">Відмінне тренування!</div>
    </div>`;
  setTimeout(()=>goHome(), 1500);
}

// ── HISTORY ──
function renderHistory(){
  const logs = [...DB.logs].reverse();
  if(!logs.length){
    document.getElementById('histContent').innerHTML=`<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">Ще немає записів.<br>Почни перше тренування!</div></div>`;
    return;
  }
  let html='';
  logs.forEach(log=>{
    const day = PLAN.find(d=>d.id===log.dayId)||{color:'#555'};
    const vol = (log.exercises||[]).reduce((a,ex)=>a+ex.sets.filter(s=>s.done).reduce((s2,s)=>s2+(s.weight*s.reps),0),0);
    const done = (log.exercises||[]).reduce((a,ex)=>a+ex.sets.filter(s=>s.done).length,0);
    let exHtml = '';
    (log.exercises||[]).forEach(ex=>{
      exHtml+=`<div class="hist-ex-name">${ex.name}</div><div class="hist-sets">`;
      ex.sets.forEach(s=>{
        const col = s.done?'var(--t2)':'var(--t4)';
        const bg = s.done?'var(--bg3)':'var(--bg2)';
        exHtml+=`<span class="hist-set-badge" style="background:${bg};border-color:var(--b2);color:${col}">${s.done?s.weight+'кг × '+s.reps:'—'}</span>`;
      });
      exHtml+='</div>';
    });
    const burnedHtml = log.burned?`<div style="font-size:11px;color:var(--t3);margin-top:4px">🔥 ${log.burned} ккал витрачено</div>`:'';
    const notesHtml = log.notes?`<div class="hist-notes">"${log.notes}"</div>`:'';
    html+=`<div class="hist-card" style="--hc:var(--b3);border-left-color:var(--b3)">
      <div class="hist-head" onclick="toggleHist('hb-${log.id}','ha-${log.id}')">
        <div><div class="hist-name">${log.dayLabel}</div><div class="hist-meta">${fmt(log.date)} · ${done} підходів · ${log.cardioMin||0} хв кардіо</div>${burnedHtml}</div>
        <div><div class="hist-vol" style="color:var(--t2)">${vol?vol+' кг':''}</div><div class="hist-arrow" id="ha-${log.id}">▼</div></div>
      </div>
      <div class="hist-body" id="hb-${log.id}">
        ${exHtml}${notesHtml}
        <button class="del-btn" onclick="delLog(${log.id})">Видалити запис</button>
      </div>
    </div>`;
  });
  document.getElementById('histContent').innerHTML=html;
}
function toggleHist(bodyId,arrowId){
  const b=document.getElementById(bodyId);
  const a=document.getElementById(arrowId);
  const open=b.classList.toggle('open');
  a.textContent=open?'▲':'▼';
}
function delLog(id){
  DB.logs=DB.logs.filter(l=>l.id!==id); save(DB); renderHistory();
}

// ── STATS ──
function renderStats(){
  const logs = DB.logs;
  const totalKg = logs.reduce((a,l)=>(l.exercises||[]).reduce((b,ex)=>b+ex.sets.filter(s=>s.done).reduce((c,s)=>c+(s.weight*s.reps),0),a),0);
  const cardio = logs.reduce((a,l)=>a+(+l.cardioMin||0),0);
  const week = logs.filter(l=>Date.now()-new Date(l.date)<7*86400000).length;
  const totalBurned = logs.reduce((a,l)=>a+(+l.burned||0),0);
  const bw = DB.bw||85;
  const pct = Math.min(100,Math.max(0,((85-bw)/5)*100));
  const col = 'var(--b3)';
  const pr={};
  logs.forEach(l=>(l.exercises||[]).forEach(ex=>ex.sets.forEach(s=>{
    if(s.done&&s.weight>0&&(!pr[ex.name]||s.weight>pr[ex.name]))pr[ex.name]=s.weight;
  })));
  const prHtml = Object.keys(pr).length
    ? Object.entries(pr).map(([n,w])=>`<div class="pr-row"><span class="pr-name">${n}</span><span class="pr-badge">${w} кг</span></div>`).join('')
    : `<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-text">Після перших тренувань тут<br>з\u2019явиться твій прогрес</div></div>`;
  document.getElementById('statsContent').innerHTML=`
    <div class="stats2-row">
      <div class="stat-card" style="--c:var(--b3)"><div class="stat-label">Тренувань</div><div class="stat-val">${logs.length}<span class="stat-unit">раз</span></div></div>
      <div class="stat-card" style="--c:var(--b3)"><div class="stat-label">Об&#39;єм</div><div class="stat-val">${Math.round(totalKg/1000)}<span class="stat-unit">т</span></div></div>
      <div class="stat-card" style="--c:var(--b3)"><div class="stat-label">Кардіо</div><div class="stat-val">${cardio}<span class="stat-unit">хв</span></div></div>
      <div class="stat-card" style="--c:var(--b3)"><div class="stat-label">Тижень</div><div class="stat-val">${week}<span class="stat-unit">раз</span></div></div>
      <div class="stat-card" style="--c:var(--b3);grid-column:1/-1"><div class="stat-label">Загалом спалено (тренування)</div><div class="stat-val">${totalBurned}<span class="stat-unit">ккал</span></div></div>
    </div>
    <div class="weight-box" style="margin-bottom:12px">
      <div class="section-label">Прогрес ваги</div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--t3);margin-bottom:6px"><span>85 кг</span><span>80 кг</span></div>
      <div class="progress-bar-bg" style="height:12px;border-radius:6px"><div class="progress-bar-fill" style="width:${pct}%;background:${col};border-radius:6px"></div></div>
      <div style="text-align:center;margin-top:8px;font-size:16px;font-weight:800">${bw} кг <span style="font-size:12px;color:var(--t3);font-weight:400">(${bw<=80?'✅ Ціль!':'залишилось '+(bw-80).toFixed(1)+' кг'})</span></div>
    </div>
    <div class="weight-box"><div class="section-label">Максимальна вага по вправах</div>${prHtml}</div>`;
}

// ── CALENDAR ──
let calDate = new Date();
function renderCalendar(){
  const y = calDate.getFullYear(), m = calDate.getMonth();
  const months = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
  const dows = ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
  // build workout date map
  const wmap = {};
  DB.logs.forEach(l=>{
    const k = l.date.slice(0,10);
    if(!wmap[k]) wmap[k]=[];
    wmap[k].push(l);
  });
  const firstDay = new Date(y,m,1);
  let startDow = firstDay.getDay(); // 0=Sun
  startDow = startDow===0?6:startDow-1; // convert to Mon=0
  const daysInMonth = new Date(y,m+1,0).getDate();
  const today = new Date();
  const todayStr = today.toISOString().slice(0,10);

  let dowHtml = dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  let cellHtml = '';
  for(let i=0;i<startDow;i++) cellHtml+='<div class="cal-day empty"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const logs = wmap[ds]||[];
    const isToday = ds===todayStr;
    const hasDot = logs.length>0;
    const dotHtml = hasDot?'<div class="cal-dot" style="background:var(--acc2)"></div>':'';
    const bg = logs.length?'var(--bg3)':'var(--bg2)';
    const border = isToday?'border:1px solid var(--b3)':'border:1px solid var(--b1)';
    cellHtml+=`<div class="cal-day${logs.length?' has-workout':''}" style="background:${bg};${border}" onclick="showCalDay('${ds}')">${d}${dotHtml}</div>`;
  }

  const legendHtml = '';

  document.getElementById('calContent').innerHTML=`
    <div class="cal-header">
      <button class="cal-nav-btn" onclick="calNav(-1)">‹</button>
      <div class="cal-month">${months[m]} ${y}</div>
      <button class="cal-nav-btn" onclick="calNav(1)">›</button>
    </div>
    <div class="cal-grid">${dowHtml}${cellHtml}</div>
    <div class="cal-legend">${legendHtml}</div>
    <div id="calDayDetail"></div>`;
}
function calNav(dir){
  calDate = new Date(calDate.getFullYear(), calDate.getMonth()+dir, 1);
  renderCalendar();
}
function showCalDay(ds){
  const logs = DB.logs.filter(l=>l.date.slice(0,10)===ds);
  if(!logs.length){document.getElementById('calDayDetail').innerHTML='';return;}
  const d = new Date(ds+'T12:00:00').toLocaleDateString('uk-UA',{weekday:'long',day:'numeric',month:'long'});
  let html = logs.map(log=>{
    const day = PLAN.find(p=>p.id===log.dayId)||{color:'#555'};
    const vol = (log.exercises||[]).reduce((a,ex)=>a+ex.sets.filter(s=>s.done).reduce((s2,s)=>s2+(s.weight*s.reps),0),0);
    const done = (log.exercises||[]).reduce((a,ex)=>a+ex.sets.filter(s=>s.done).length,0);
    return `<div class="cal-detail" style="border-left:3px solid var(--b3)">
      <div class="cal-detail-title" style="color:var(--t2)">${log.dayLabel}</div>
      <div class="cal-detail-meta">${done} підходів · ${vol?vol+' кг загального об&#39;єму · ':''}${log.cardioMin||0} хв кардіо${log.burned?' · 🔥 '+log.burned+' ккал':''}</div>
      ${log.notes?`<div style="font-size:12px;color:var(--t3);margin-top:6px;font-style:italic">"${log.notes}"</div>`:''}
    </div>`;
  }).join('');
  document.getElementById('calDayDetail').innerHTML=`<div style="font-size:11px;color:var(--t4);margin-top:14px;margin-bottom:6px;letter-spacing:2px;text-transform:uppercase">${d}</div>${html}`;
}

// ── HEALTH ──
let healthTab = 'log';
function renderHealth(){
  const today = todayKey();
  const todayH = DB.health.find(h=>h.date===today)||{date:today,meals:[],burned:0};
  if(!todayH.meals) todayH.meals=[];
  const consumed = todayH.meals.reduce((a,m)=>a+(m.kcal||0),0);
  const burned = todayH.burned||0;
  const bal = consumed - burned;
  const balColor = bal>200?'var(--t2)':bal<0?'var(--acc)':'var(--t1)';
  const balLabel = bal>0?`+${bal} ккал (надлишок)`:bal<0?`${bal} ккал (дефіцит)`:'На нулі';

  const mealItems = todayH.meals.map((m,i)=>`
    <div class="meal-item">
      <div><div class="meal-kcal">${m.kcal} ккал</div><div class="meal-time">${m.label||''} ${m.time}</div></div>
      <button class="meal-del" onclick="delMeal(${i})">✕</button>
    </div>`).join('');

  const histHtml = [...DB.health].reverse().map(h=>{
    const hMeals = h.meals||[];
    const hConsumed = hMeals.reduce((a,m)=>a+(m.kcal||0), h.consumed||0);
    const hBurned = h.burned||0;
    const hBal = hConsumed - hBurned;
    const bc = hBal>200?'var(--t2)':hBal<0?'var(--acc)':'var(--t1)';
    return `<div class="health-hist-card">
      <div class="health-hist-date">${fmtDate(h.date+'T12:00:00')}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;font-size:12px">
        ${hConsumed?`<div style="color:var(--t3)">🍽 <b style="color:var(--t2)">${hConsumed}</b> ккал</div>`:''}
        ${hBurned?`<div style="color:var(--t3)">🔥 <b style="color:var(--t2)">${hBurned}</b> ккал</div>`:''}
        ${hBal?`<div style="color:var(--t3)">⚖ <b style="color:${bc}">${hBal>0?'+':''}${hBal}</b></div>`:''}
      </div>
      ${hMeals.length?`<div style="font-size:11px;color:var(--t4);margin-top:5px">${hMeals.map(m=>m.kcal+' ккал').join(' · ')}</div>`:''}
    </div>`;
  }).join('');

  document.getElementById('healthContent').innerHTML=`
    <div class="health-tabs">
      <div class="htab${healthTab==='log'?' active':''}" onclick="healthTab='log';renderHealth()">🍽 Сьогодні</div>
      <div class="htab${healthTab==='hist'?' active':''}" onclick="healthTab='hist';renderHealth()">📊 Журнал</div>
    </div>
    ${healthTab==='log'?`
    <div class="kcal-balance">
      <div class="kcal-balance-label">Баланс сьогодні</div>
      <div class="kcal-balance-val" style="color:${balColor}">${bal>0?'+':''}${bal}</div>
      <div class="kcal-balance-sub">${balLabel}</div>
    </div>
    <div class="section-label" style="margin-top:14px">+ Додати прийом їжі</div>
    <div class="meal-add-row">
      <input type="number" class="meal-add-input" id="mealKcal" placeholder="ккал" min="0">
      <input type="text" class="meal-add-input" id="mealLabel" placeholder="назва (необов)" style="font-size:14px;font-weight:400">
      <button class="meal-add-btn" onclick="addMeal()">+ Додати</button>
    </div>
    <div class="meal-list">${mealItems||'<div style="color:var(--t4);font-size:12px;text-align:center;padding:8px">Ще нічого не додано сьогодні</div>'}</div>
    ${consumed?`<div class="meal-total"><div class="meal-total-label">Всього спожито</div><div class="meal-total-val">${consumed} ккал</div></div>`:''}
    <div class="health-grid" style="margin-top:4px">
      <div class="health-field full">
        <div class="health-label">🔥 Витрачено ккал (з годинника Samsung)</div>
        <input type="number" class="health-input" id="hBurned" value="${burned||''}" placeholder="0" oninput="saveBurned()">
        <div class="health-unit">ккал за тренування</div>
      </div>
    </div>`:`
    ${histHtml||'<div class="empty-state"><div class="empty-icon">🍽</div><div class="empty-text">Ще немає записів.<br>Почни додавати їжу сьогодні!</div></div>'}
    `}`;
}

function addMeal(){
  const kcal = +document.getElementById('mealKcal')?.value||0;
  if(!kcal) return;
  const label = document.getElementById('mealLabel')?.value||'';
  const now = new Date();
  const time = now.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
  const today = todayKey();
  let todayH = DB.health.find(h=>h.date===today);
  if(!todayH){todayH={date:today,meals:[],burned:0};DB.health.push(todayH);}
  if(!todayH.meals) todayH.meals=[];
  todayH.meals.push({kcal,label,time});
  save(DB);
  document.getElementById('mealKcal').value='';
  document.getElementById('mealLabel').value='';
  renderHealth();
}

function delMeal(idx){
  const today = todayKey();
  const todayH = DB.health.find(h=>h.date===today);
  if(todayH?.meals) todayH.meals.splice(idx,1);
  save(DB);
  renderHealth();
}

function saveBurned(){
  const today = todayKey();
  let todayH = DB.health.find(h=>h.date===today);
  if(!todayH){todayH={date:today,meals:[],burned:0};DB.health.push(todayH);}
  todayH.burned = +document.getElementById('hBurned')?.value||0;
  save(DB);
  const consumed = (todayH.meals||[]).reduce((a,m)=>a+(m.kcal||0),0);
  const bal = consumed - todayH.burned;
  const balColor = bal>200?'var(--t2)':bal<0?'var(--acc)':'var(--t1)';
  const balLabel = bal>0?`+${bal} ккал (надлишок)`:bal<0?`${bal} ккал (дефіцит)`:'На нулі';
  const bv = document.querySelector('.kcal-balance-val');
  const bs = document.querySelector('.kcal-balance-sub');
  if(bv){bv.textContent=(bal>0?'+':'')+bal;bv.style.color=balColor;}
  if(bs){bs.textContent=balLabel;}
}

// ── TELEGRAM INIT ──
if(window.Telegram?.WebApp){
  const tg = window.Telegram.WebApp;
  tg.ready(); tg.expand();
  document.body.style.background = tg.colorScheme==='light'?'#1a1a1c':'#0c0c0e';
}
renderHome();
</script>
